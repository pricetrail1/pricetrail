# Crawls every day and publishes the website. Free, on GitHub's servers.
#
# Results are committed back into the repository, so git history IS the
# pricing archive: every price on every day, timestamped and tamper-evident,
# hosted for nothing.
#
# SETUP (once):
#   1. Push this repo to GitHub.
#   2. Settings > Secrets and variables > Actions > New repository secret
#      Name: ANTHROPIC_API_KEY   Value: your key
#   3. Settings > Actions > General > Workflow permissions
#      Choose "Read and write permissions", Save. Without this the commit
#      step fails with a 403.
#   4. Settings > Pages > Source: "GitHub Actions".
#   5. Edit BASE_URL in pricetrail/site.py to your real address, otherwise
#      search engines index links that go nowhere.
#
# GitHub disables scheduled workflows in repos with no activity for 60 days.
# If it goes quiet, push any commit to wake it up.

name: crawl and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Crawl and build the site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Hard budget ceiling. A bug that loops cannot drain the account:
        # it costs 50 cents and stops.
        run: python -m pricetrail.publish --budget 0.50

      - name: Save the weekly digest
        if: github.event_name == 'schedule'
        run: |
          mkdir -p digests
          python -m pricetrail.report digest --days 7 > "digests/$(date +%Y-%m-%d).md"

      - name: Commit the archive
        run: |
          git config user.name "pricetrail-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p data digests
          git add data digests
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "crawl: $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
