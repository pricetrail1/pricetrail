# ---------- removed, revisit later ----------
# These use interactive pricing (a slider where you pick a contact count and
# the price is calculated in your browser). There is no price in the HTML to
# read, so extraction returns nothing usable.
#
# Removed rather than left broken: one vendor with wrong data is worse than
# twenty with right data.
#
#   Groove   https://www.groovehq.com/pricing
#   Klaviyo  https://www.klaviyo.com/pricing
#   Loops    https://loops.so/pricing
#   ActiveCampaign  https://www.activecampaign.com/pricing
#   Zoho Desk       https://www.zoho.com/desk/pricing.html
#     (diagnosed Aug 2026: 0 prices anywhere in the HTML -- the page
#      renders currency selectors and loads figures afterwards)
#
# To handle these later you would need a headless browser to render the page
# first. That costs money and complexity -- worth it once you have paying
# customers asking for these specific vendors, not before.
