# Vendors to track.
#
# Two categories deliberately, not twenty. Both are bought by the same person
# (someone running support or marketing at a software company), which means one
# set of comparison pages serves one buyer. Scattering across ten unrelated
# categories gives you ten shallow audiences instead of one useful one.
#
# IMPORTANT: these URLs were correct when written but companies rebrand and
# reorganise constantly. Some WILL be dead. Run:
#
#     python -m pricetrail.run --dry-run
#
# and fix anything that reports FAIL. That first cleanup pass is normal and
# takes about twenty minutes.
#
# crawl_tier: daily = check every run, weekly = check on Mondays.
# Put the big names on daily and the long tail on weekly to save money.

vendors:
  # ---------- customer support / helpdesk ----------
  - name: Intercom
    pricing_url: https://www.intercom.com/pricing
    category: helpdesk
    crawl_tier: daily

  - name: Zendesk
    pricing_url: https://www.zendesk.com/pricing/
    category: helpdesk
    crawl_tier: daily

  - name: Freshdesk
